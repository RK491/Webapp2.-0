    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (localStorage.getItem('chickenland_theme_v1') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
        if ('caches' in window) {
          caches.delete('pages-network-first').catch(function () {});
        }
        if ('serviceWorker' in navigator) {
          var swReloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (swReloaded) return;
            try {
              if (sessionStorage.getItem('alphagram_sw_reloaded') === '1') return;
              sessionStorage.setItem('alphagram_sw_reloaded', '1');
            } catch (e) {}
            swReloaded = true;
            window.location.reload();
          });
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update().catch(function () {});
            }
          }).catch(function () {});
        }
      } catch (e) {}
    </script>
